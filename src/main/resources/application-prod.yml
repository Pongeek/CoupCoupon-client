spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

cors:
  allowed-origins: ${CORS_ORIGINS}

logging:
  level:
    root: WARN
    com.johnbryce.coupcouponpt2: INFO
