spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coupcoupon?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

logging:
  level:
    com.johnbryce.coupcouponpt2: DEBUG
